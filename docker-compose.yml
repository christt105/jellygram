name: cinegram

services:
  bot-net:
    image: ghcr.io/christt105/cinegram-bot-net:${CINEGRAM_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BOT_NET_PORT:-8088}:8080"
    volumes:
      - ./appdata/bot-net:/data
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data/media
    environment:
      - JELLYFIN_MOVIES_DIR=/data/media/${MOVIES_SUBDIR:-movies}
      - JELLYFIN_SHOWS_DIR=/data/media/${SHOWS_SUBDIR:-shows}
      - DOWNLOADS_DIR=/data/media/${DOWNLOADS_SUBDIR:-downloads}

  backend:
    image: ghcr.io/christt105/cinegram-backend:${CINEGRAM_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    volumes:
      - ./appdata/backend:/data
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    restart: unless-stopped

  web:
    image: ghcr.io/christt105/cinegram-web:${CINEGRAM_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_TOKEN=${JELLYFIN_TOKEN:-}
      - BACKEND_PORT=${BACKEND_PORT:-8005}
      - BOT_NET_PORT=${BOT_NET_PORT:-8088}
